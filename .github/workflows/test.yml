name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Checks read source and publish no repository changes.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Capped at 28 minutes before the delivery polling deadline: a job still running
    # at that limit has hung rather than completed within its check budget.
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            mode: lint
            targets: lint
          - name: Test
            mode: test
            targets: test build
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up orchestration Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Run Make checks with source and artifact evidence
        run: |
          node tools/ci-evidence.mjs begin ${{ matrix.mode }}
          set +e
          make ${{ matrix.targets }} 2>&1 | tee .check-results/ci-${{ matrix.mode }}/check.log
          status=$?
          set -e
          node tools/ci-evidence.mjs finish ${{ matrix.mode }} "$status"
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checks-${{ matrix.mode }}
          path: .check-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
